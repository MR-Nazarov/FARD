# Stage A + B registration for the published FARD_dataset (Zenodo).
#
# The released dataset uses archive-friendly series names -- T1_HR, T1_LR,
# T1_bicubic -- and one subject per directory under subjects/. The internal
# SHEBA tree uses BICUBIC_T1_LR and per-fold directories, so it has its own
# config (sheba_lr2hr.yaml). The registration itself is identical.
#
#   python -m data_prep.register_lr2hr --config data_prep/configs/fard_dataset_lr2hr.yaml --stage A
#   python -m data_prep.register_lr2hr --config data_prep/configs/fard_dataset_lr2hr.yaml --stage B

# Point FARD_DATASET at wherever you extracted the download. It is separate
# from FARD_DATA, which addresses the internal dataset tree.
root: ${FARD_DATASET}

# The published dataset is flat -- one directory of subjects, no folds -- so the
# fold template resolves to the subjects directory and `folds` has one entry.
fold_template: subjects
folds: [1]

input_stage: .
stage_a_template: registration_A_{mod}
stage_b_stage: registration_B

modalities: [T1, T2, FLAIR]
reference_modality: T1

hq_name: '{mod}_HR'
lq_name: '{mod}_bicubic'
companions: ['{mod}_LR']

# true  -> fit on the HR scans (training data)
# false -> fit on the accelerated scans (test data)
hq_based: true

# null = every sub-NN directory found
cases: null

stage_a_parameters:
  MaximumNumberOfIterations: 512
stage_b_parameters: {}

skip_missing: false
