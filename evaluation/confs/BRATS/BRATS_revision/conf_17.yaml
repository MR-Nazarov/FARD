# DCAMSR T1W and T2W from revision_BRATS — normalize_by_target, all 150 cases
confs_to_process: [61, 62]

target_per_conf:
  61: t1n
  62: t2w

input_per_conf:
  61: t1n_LR_4x
  62: t2w_LR_4x

base_data_dir: /media/alex/drive2/DATASETS/MRI_deblur/BRATS/GLI/data/slices_axial/test
base_result_dir: /media/alex/DATA/AlexN/old_env/ALex/code/cpwdeblur/results/revision_BRATS

metrics: ['SSIM','PSNR','FSIM']

slices: [30,30]
save_images: false
enable_transform_visualization: false
enable_slice_preview: false
use_npy: true

normalize_for_metrics: false
normalize_by_target: true

transforms:
  clip_output:
    min_val: 0.0
    max_val: 1.0
    keys: ['output']
  transpose:
    keys: ['output']
    dims: [0,2,1]
  flip:
    keys: ['output']
    dims: [1,2]
  crop: [150,140]
