confs_to_process: [21, 22, 23]

target: t1n  # fallback
target_per_conf:
  21: t1n
  22: t2w
  23: t2f

input_per_conf:
  21: t1n_LR_4x
  22: t2w_LR_4x
  23: t2f_LR_4x

base_data_dir: /media/alex/drive2/DATASETS/MRI_deblur/BRATS/GLI/data/slices_axial/test

base_result_dir: /media/alex/DATA/AlexN/old_env/ALex/code/BRATS

metrics: ['SSIM','PSNR','FSIM','LPIPS']

slices: [30,30]
enable_transform_visualization: false
enable_slice_preview: false
use_npy: true

transforms:
  transpose:
    keys: ['output']
    dims: [0,2,1]
  flip:
    keys: [ 'output' ]
    dims: [1,2]  # match the conf_2 group (EDSR used Transposed+Flipd, alignment on)
  crop: [150,140]
