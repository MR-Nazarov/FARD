confs_to_process: [40243]

target: t2f
#target: t2f,t1n,t2w
#input: t2f_LR_4x
base_data_dir: /media/alex/drive2/DATASETS/MRI_deblur/BRATS/GLI/data/slices_axial/test

base_result_dir:  /media/alex/DATA/AlexN/old_env/ALex/code/BRATS

metrics: ['SSIM','PSNR','FSIM','LPIPS']

# Mask-based metric calculation
calc_in_mask: false  # Set to true to calculate metrics only inside mask regions
mask_name: seg  # Name of the mask folder/file in the data directory
mask_classes: [1, 2, 3, 4]  # Which mask labels to include (e.g., [1,2] for specific tumor regions)

slices: [30,30]
# Disable visualizations for faster processing
enable_transform_visualization: true  # Don't save transform images
enable_slice_preview: false            # Don't show matplotlib popup
use_npy: true

transforms:
  transpose:
    keys: ['output']
    dims: [0,2,1]
  flip:
    keys: ['output']
    dims: [1,2]
  crop: [150,140] #crop: [150,140]
  #brain_bbox: 2
