confs_to_process: [61]
#specific_cases: [2]
target: t1n
input: t1n_LR_4x
base_data_dir: /media/alex/drive2/DATASETS/MRI_deblur/BRATS/GLI/data/slices_axial/test

base_result_dir:  /media/alex/DATA/AlexN/old_env/ALex/code/BRATS

metrics: ['SSIM','PSNR','FSIM','LPIPS']

#slices: [10,10]  # Both volumes now match after padding
enable_transform_visualization: false  # Enable to debug transforms
enable_slice_preview: true
use_npy: true
print_specific_slices: false  # Set true to save per-slice images and print per-slice metric table
#specific_slice_indices: [10, 20, 30]  # Optional: process only these absolute slice indices

transforms:
  # Step 1: Clip negative values in output predictions
  clip_output:
    min_val: 0.0
    max_val: 1.0
    keys: ['output']

  # Step 2: Undo training transforms on output (flip and transpose are self-inverse)
  flip_inverse:
    keys: ['output']  # Undo training flip on output
    dims: [1,2]  # Undo spatial_axis=0 flip from training
#
  transpose_inverse:
    keys: ['output']  # Undo training transpose on output
    dims: [0,2,1]  # Undo indices=[0,2,1] from training (self-inverse)

  # Step 3: Crop output to match target size (after undoing training transforms)
  crop_to_match_target:
    reference_key: 'target'
    target_key: 'output'
    mode: 'center'
#
#  # Step 4: Convert all to sagittal plane
  transpose_to_sagittal:
    keys: ['output', 'target','input']  # Convert ALL to sagittal
    dims: [1,0,2]  # [D,H,W] -> [H,D,W]
  flip_sagittal:
    keys: ['output', 'target','input']  # Adjust sagittal orientation
    dims: [1]  # Flip slice direction

  # Step 5: Final crop if needed
  pad_or_crop:
    size: [ 140, 160 ]
    keys: [ 'output', 'target', 'input' ]  # optional, defaults to ['output', 'target']
    pad_value: 0.0  # optional, defaults to 0.0