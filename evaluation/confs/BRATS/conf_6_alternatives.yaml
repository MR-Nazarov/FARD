# Alternative sagittal transpose configurations
# After training transforms [D,W,H], try these for sagittal:

current_config:
  transpose_to_sagittal: [1,0,2]  # [D,W,H] -> [W,D,H]
  flip_sagittal: [2]

option_2:
  transpose_to_sagittal: [1,2,0]  # [D,W,H] -> [W,H,D]
  flip_sagittal: [1]

option_3:
  transpose_to_sagittal: [2,0,1]  # [D,W,H] -> [H,D,W]
  flip_sagittal: [0]

option_4:
  transpose_to_sagittal: [2,1,0]  # [D,W,H] -> [H,W,D]
  flip_sagittal: [1]

option_5:
  transpose_to_sagittal: [0,1,2]  # [D,W,H] -> [D,W,H] (no change)
  flip_sagittal: []

option_6:
  transpose_to_sagittal: [0,2,1]  # [D,W,H] -> [D,H,W]
  flip_sagittal: [1]

# To use: copy the transpose_to_sagittal and flip_sagittal lines into conf_6.yaml
