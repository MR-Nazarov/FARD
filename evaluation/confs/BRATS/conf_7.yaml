confs_to_process: [901]
#specific_cases: [1]
target: t1n
#input: t1n_LR_4x
base_data_dir: /media/alex/drive2/DATASETS/MRI_deblur/BRATS/GLI/data/slices/test

base_result_dir:  /media/alex/DATA/AlexN/old_env/ALex/code/BRATS

metrics: ['SSIM','PSNR','FSIM','LPIPS']

slices: [23,42]  # Both volumes now match after padding
enable_transform_visualization: false  # Enable to debug transforms
enable_slice_preview: false
use_npy: true

transforms:
  # Step 1: Undo training transforms on output (flip and transpose are self-inverse)
  flip_inverse:
    keys: ['output']  # Undo training flip on output
    dims: [1]  # Same as training flip (self-inverse)
#  transpose_inverse:
#    keys: ['output']  # Undo training transpose on output
#    dims: [0,2,1]  # Same as training transpose (self-inverse)
#
#  # Step 2: Crop output to match target size (182x218)
#  crop_to_match_target:
#    reference_key: 'target'
#    target_key: 'output'
#    mode: 'center'

  # Step 3: Convert all three to sagittal plane
  transpose_to_sagittal:
    keys: ['output', 'target', 'input']  # Convert ALL to sagittal
    dims: [2,0,1]  # [D,W,H] -> [H,W,D]
  flip_sagittal:
    keys: ['output', 'target', 'input']  # Adjust sagittal orientation
    dims: [2]  # Flip slice direction

  # Step 4: Final crop if needed
  #crop: [150, 160]
  pad_or_crop:
    size: [ 150, 140 ]
    keys: [ 'output', 'target', 'input' ]  # optional, defaults to ['output', 'target']
    pad_value: 0.0  # optional, defaults to 0.0