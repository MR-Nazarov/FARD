confs_to_process: [45]

target: t2f
input: t2f_LR_4x
base_data_dir: /media/alex/drive2/DATASETS/MRI_deblur/BRATS/GLI/data/slices_axial/test

base_result_dir:  /media/alex/DATA/AlexN/old_env/ALex/code/ablations

metrics: ['SSIM','PSNR','FSIM','LPIPS']
enable_transform_visualization: false  # Don't save transform images
