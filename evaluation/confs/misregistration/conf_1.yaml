# misregistration T1n-output group. input_per_conf lists ONLY the self (diagonal)
# confs -> misregistered TARGET input; guide confs fall back to input (clean) so
# CorruptInput == CleanInput for guides (brief's baseline, not cross-contrast).
confs_to_process: [111, 112, 113, 121, 122, 123, 131, 132, 133]

target: t1n
input: t1n_LR_4x

input_per_conf:
  111: t1n_LR_4x_misreg_mild
  112: t1n_LR_4x_misreg_moderate
  113: t1n_LR_4x_misreg_severe

base_data_dir: /media/alex/drive2/DATASETS/MRI_deblur/BRATS/GLI/data/slices_axial/test
base_result_dir: /media/alex/DATA/AlexN/old_env/ALex/code/cpwdeblur/results/misregistration

metrics: ['SSIM','PSNR','FSIM','LPIPS']

slices: [30,30]
enable_transform_visualization: false
enable_slice_preview: false
use_npy: true
skip_volume_alignment: true
normalize_for_metrics: false

transforms:
  crop: [150,140]
